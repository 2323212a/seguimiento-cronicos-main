services:
  postgres:
    image: postgres:18
    container_name: seguimiento-cronicos-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: seguimiento_cronicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seguimiento_cronicos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_v18:
