# Opcional: PostgreSQL local con el esquema cargado automáticamente.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seguimiento_cronicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
